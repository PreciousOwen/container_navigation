# Nginx site config for: https://wosac.silicon4forge.org
#
# Assumes:
# - Gunicorn is running on 127.0.0.1:8001 (systemd service provided)
# - Django STATIC_ROOT has been collected to /home/ubuntu/daudi/staticfiles
# - TLS certs are installed (Let's Encrypt or otherwise)

upstream daudi_app {
    server 127.0.0.1:8001 fail_timeout=0;
}

server {
    listen 80;
    server_name wosac.silicon4forge.org;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Temporary HTTP mode (works before certificates exist).
    # After certs are installed, you can switch this to a redirect to HTTPS.
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_read_timeout 60s;

        proxy_pass http://daudi_app;
    }
}

